<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7ef">
<meta name="description" content="특수교육 수업을 위한 국어·수학·일상생활 PDF 학습지를 학년군별로 내려받으세요.">
<title>꾸준히 학습지 | 특수교육 자료실</title>
<link rel="stylesheet" href="style.css?v=6">
<script src="catalog.js?v=3" defer></script>
<script src="app.js?v=6" defer></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8544439780701521" crossorigin="anonymous"></script>
</head>
<body data-view="library">
<a class="skip" href="#library">자료 목록으로 건너뛰기</a>
<header class="header">
  <div class="wrap header-inner">
    <a class="brand" href="./" aria-label="꾸준히 학습지 자료실">
      <span class="brand-icon" data-icon="book"></span><span>꾸준히 학습지<small>특수교육 수업자료실</small></span>
    </a>
    <nav aria-label="주 메뉴">
      <a href="./" aria-current="page">학습지 자료실</a>
      <a href="community.html">교사 공유 게시판</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <p class="eyebrow"><span></span> 선생님을 위한 특수교육 자료실</p>
      <h1 id="hero-title">꾸준히<br>학습지<span>.</span></h1>
      <p class="hero-description">초등부터 고등까지, 교과와 학년군에 맞는<br class="desktop"> 인쇄용 학습지를 찾아보세요.</p>
      <div class="hero-actions">
        <a class="button button-cream" href="#library"><span data-icon="book"></span> 학습지 찾아보기</a>
        <a class="button button-ghost" href="community.html">교사 자료 둘러보기 <span data-icon="arrow"></span></a>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <span class="art-orbit"></span><span class="art-spark">✦</span><span class="art-star">✧</span><span class="art-dot"></span>
      <img class="paper paper-back" id="hero-back" hidden alt="" width="1080" height="1350">
      <img class="paper paper-front" id="hero-front" hidden alt="" width="1080" height="1350">
      <span class="print-label"><span data-icon="file"></span> 인쇄용 PDF</span>
    </div>
  </section>
  <section class="workspace" id="library" tabindex="-1" aria-labelledby="section-title">
    <aside class="sidebar" aria-label="학년군 선택">
      <h2><span data-icon="layers"></span> 학년군</h2>
      <div id="grade-filter"></div>
    </aside>
    <div class="main-panel">
      <div class="section-heading">
        <div>
          <h2 id="section-title">학습지 자료실</h2>
          <p id="section-description">수업에 바로 쓸 수 있는 PDF 학습지를 찾아보세요.</p>
        </div>
      </div>
      <form action="admin.html" method="get" style="display:flex;justify-content:flex-end;margin-top:8px"><button class="button share-top" type="submit">관리자 로그인</button></form>
      <div class="toolbar">
        <div id="subject-filter" role="group" aria-label="교과 선택"></div>
        <label class="search"><span data-icon="search"></span><span class="sr-only">자료 검색</span><input id="search" type="search" placeholder="학습지 검색" autocomplete="off"></label>
      </div>
      <div class="results">
        <p id="result-count" role="status" aria-live="polite"></p>
        <button type="button" class="reset" id="reset" hidden>필터 초기화</button>
      </div>
      <p id="network-note" role="status" hidden></p>
      <div id="cards" class="cards"></div>
      <noscript>자료 목록을 보려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
    </div>
  </section>
</main>
<footer class="footer">
  <div class="wrap footer-inner"><span><strong>꾸준히 학습지</strong> · 특수교육 수업자료실</span>
    <div><a href="https://github.com/zxc3285123-web/kkujunhi-worksheets#readme">자료 출처·운영 안내</a><a href="privacy.html">개인정보 처리방침</a><a href="admin.html">공식 자료 관리</a></div>
  </div>
</footer>
<dialog id="details" aria-labelledby="detail-title">
  <div class="dialog-top"><h2 id="detail-title"></h2><form method="dialog"><button class="icon-button" aria-label="미리보기 닫기" data-icon="close"></button></form></div>
  <p id="detail-meta"></p><div id="detail-images"></div><div id="detail-actions" class="dialog-actions"></div>
</dialog>
<script>
if (location.hash === '#community') location.replace('community.html');
</script>
</body>
</html>
